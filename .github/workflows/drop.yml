name: Drop guest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          npm install --global pnpm@10.33.2
          drop/build.sh
          python3 drop/check.py
          CGO_ENABLED=1 go test -tags "$(cat build-tags.txt),crew_drop" ./internal/dropsupervisor ./internal/dropfiles ./internal/client ./internal/crewruntime
